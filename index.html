<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes">
<title>365 — رحلتك</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="logo">365</div><div><b>رحلتك تبدأ النهارده</b><small>تحدي صغير كل يوم</small></div><div class="streak">🔥 <span id="streak">0</span></div></header>
<main>
<section class="hero"><div class="sky">✦</div><div class="day">اليوم <b id="dayNo">1</b> من 365</div><h1 id="title">ابدأ بحاجة صغيرة.</h1><p id="desc">إنجاز بسيط النهارده ممكن يغيّر سنة كاملة.</p><button id="done" class="done">أنجزت التحدي ✓</button></section>
<section class="stats"><div><b id="completed">0</b><span>منجز</span></div><div><b id="percent">0%</b><span>من الرحلة</span></div><div><b id="left">365</b><span>متبقي</span></div></section>
<section class="map"><div class="maphead"><h2>🗺️ خريطة السنة</h2><span id="monthName"></span></div><div id="days" class="days"></div></section>
<section class="card"><h2>🎯 أنواع التحديات</h2><div class="chips"><span>🧠 تعلم</span><span>💪 صحة</span><span>💰 فلوس</span><span>❤️ علاقات</span><span>🌱 أثر</span><span>✨ تطوير</span></div></section>
</main>
<nav><button class="active">🏠<small>الرئيسية</small></button><button onclick="scrollToMap()">🗺️<small>الخريطة</small></button><button onclick="resetAll()">↻<small>إعادة</small></button></nav>
<script src="app.js"></script></body></html>
